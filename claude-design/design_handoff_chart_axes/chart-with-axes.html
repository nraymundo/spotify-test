<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Chart with Axes — Reference</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  html, body { margin:0; padding:24px; background:#F0EEE9; font-family:"Inter",system-ui,sans-serif; color:#121212; }
  .card {
    max-width: 360px;
    padding: 14px;
    border: 1.5px solid #121212;
    border-radius: 14px;
    background: #F7F5F0;
  }
  .header { display:flex; justify-content:space-between; align-items:flex-start; }
  .kicker {
    font-family:"JetBrains Mono",monospace; font-size:10px;
    text-transform:uppercase; letter-spacing:0.5px; color:#7A756B;
  }
  .big { font-weight:800; font-size:38px; letter-spacing:-1.4px; line-height:1; margin-top:2px; }
  .big small { font-family:"JetBrains Mono",monospace; font-size:12px; color:#3D3D3D; margin-left:4px; font-weight:400; }
  .delta { font-weight:700; font-size:14px; color:#588B8B; margin-top:2px; }
  .right-kicker { text-align:right; }

  .chart-row { margin-top:10px; display:flex; gap:6px; }
  .yaxis {
    display:flex; flex-direction:column; justify-content:space-between;
    height:80px; padding:1px 0;
  }
  .axislabel {
    font-family:"JetBrains Mono",monospace; font-size:9px; color:#7A756B; font-weight:400;
  }
  .chart-col { flex:1; min-width:0; }
  .chart-svg { width:100%; height:80px; display:block; }
  .xaxis {
    display:flex; justify-content:space-between; margin-top:6px;
  }
</style>
</head>
<body>
<div class="card">
  <div class="header">
    <div>
      <div class="kicker">total · 6mo</div>
      <div class="big">13,422<small>min</small></div>
    </div>
    <div class="right-kicker">
      <div class="kicker">vs prev</div>
      <div class="delta">↑ 22.4%</div>
    </div>
  </div>

  <div class="chart-row">
    <div class="yaxis">
      <span class="axislabel">3k</span>
      <span class="axislabel">1.5k</span>
      <span class="axislabel">0</span>
    </div>
    <div class="chart-col">
      <svg class="chart-svg" viewBox="0 0 320 80" preserveAspectRatio="none">
        <defs>
          <linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#FFD166" stop-opacity="0.35" />
            <stop offset="1" stop-color="#FFD166" stop-opacity="0" />
          </linearGradient>
        </defs>
        <path d="M0,55 L13,48 26,52 39,42 53,47 66,38 79,30 92,34 106,26 119,28 132,32 145,22 158,28 172,21 185,15 198,21 211,25 224,19 238,12 251,14 264,8 277,4 290,9 304,3 320,3 L320,80 L0,80 Z" fill="url(#g)" />
        <path d="M0,55 L13,48 26,52 39,42 53,47 66,38 79,30 92,34 106,26 119,28 132,32 145,22 158,28 172,21 185,15 198,21 211,25 224,19 238,12 251,14 264,8 277,4 290,9 304,3 320,3" fill="none" stroke="#FFD166" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
      </svg>
      <div class="xaxis">
        <span class="axislabel">nov</span>
        <span class="axislabel">dec</span>
        <span class="axislabel">jan</span>
        <span class="axislabel">feb</span>
        <span class="axislabel">mar</span>
        <span class="axislabel">apr</span>
      </div>
    </div>
  </div>
</div>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Home · 30-Day Chart with Axes — Reference</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  html, body { margin:0; padding:24px; background:#F0EEE9; font-family:"Inter",system-ui,sans-serif; color:#121212; }
  .card {
    max-width: 320px;
    padding: 12px;
    border: 1.5px solid #121212;
    border-radius: 12px;
    background: #F7F5F0;
  }
  .card-header {
    display:flex; justify-content:space-between; align-items:center; margin-bottom: 8px;
  }
  .kicker {
    font-family:"JetBrains Mono",monospace; font-size:10px;
    text-transform:uppercase; letter-spacing:0.5px; color:#3D3D3D;
  }
  .chips { display:flex; gap:4px; }
  .chip {
    font-family:"JetBrains Mono",monospace; font-size:9px;
    padding: 2px 6px; border:1px solid #121212; border-radius:99px;
    text-transform:uppercase; letter-spacing:0.4px; color:#3D3D3D;
  }
  .chip.active { background:#FFD166; border-color:#FFD166; color:#121212; }

  .chart-row { display:flex; gap:6px; }
  .yaxis {
    display:flex; flex-direction:column; justify-content:space-between;
    height:60px; padding:1px 0;
  }
  .axislabel {
    font-family:"JetBrains Mono",monospace; font-size:9px; color:#7A756B; font-weight:400;
  }
  .chart-col { flex:1; min-width:0; }
  .chart-svg { width:100%; height:60px; display:block; }
  .xaxis {
    display:flex; justify-content:space-between; margin-top:6px;
  }
</style>
</head>
<body>
<div class="card">
  <div class="card-header">
    <div class="kicker">listening · 30 days</div>
    <div class="chips">
      <span class="chip">7d</span>
      <span class="chip active">30d</span>
      <span class="chip">6m</span>
    </div>
  </div>

  <div class="chart-row">
    <div class="yaxis">
      <span class="axislabel">200</span>
      <span class="axislabel">100</span>
      <span class="axislabel">0</span>
    </div>
    <div class="chart-col">
      <svg class="chart-svg" viewBox="0 0 280 60" preserveAspectRatio="none">
        <defs>
          <linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#FFD166" stop-opacity="0.35" />
            <stop offset="1" stop-color="#FFD166" stop-opacity="0" />
          </linearGradient>
        </defs>
        <!--
          points (15 samples, normalized to 0-60 over a max of ~120):
          [34,50,42,68,55,80,90,72,110,95,88,120,100,86,94]
          y' = 60 - (v / 120) * 60
        -->
        <path d="M0,43 L20,35 40,39 60,26 80,33 100,20 120,15 140,24 160,5 180,12 200,16 220,0 240,10 260,17 280,13 L280,60 L0,60 Z" fill="url(#g)" />
        <path d="M0,43 L20,35 40,39 60,26 80,33 100,20 120,15 140,24 160,5 180,12 200,16 220,0 240,10 260,17 280,13" fill="none" stroke="#FFD166" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
      </svg>
      <div class="xaxis">
        <span class="axislabel">mar 25</span>
        <span class="axislabel">apr 09</span>
        <span class="axislabel">apr 24</span>
      </div>
    </div>
  </div>
</div>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Day Detail — Reference</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  html, body { margin:0; padding:24px; background:#F0EEE9; font-family:"Inter",system-ui,sans-serif; color:#121212; }
  .phone { width: 360px; padding: 14px 16px; border:1.5px solid #121212; border-radius:24px; background:#F7F5F0; }
  .mono { font-family:"JetBrains Mono",monospace; }
  .dim { color:#7A756B; }
  .back { font-family:"JetBrains Mono",monospace; font-size:10px; color:#7A756B; margin-bottom:10px; }
  .kicker { font-family:"JetBrains Mono",monospace; font-size:10px; text-transform:uppercase; letter-spacing:0.5px; color:#3D3D3D; }
  .display { font-weight:800; font-size:26px; letter-spacing:-0.6px; line-height:1.1; margin-top:2px; }
  .summary { margin-top:10px; margin-bottom:12px; padding:10px; border:1.5px solid #121212; border-radius:12px;
    display:flex; justify-content:space-between; }
  .stat-label { font-family:"JetBrains Mono",monospace; font-size:9px; text-transform:uppercase; letter-spacing:0.5px; color:#7A756B; }
  .stat-value { font-weight:800; font-size:18px; }
  .stat-suffix { font-family:"JetBrains Mono",monospace; font-size:10px; color:#3D3D3D; font-weight:400; margin-left:2px; }
  .chips { display:flex; gap:6px; margin-bottom: 12px; }
  .chip { font-family:"JetBrains Mono",monospace; font-size:9px; padding:2px 6px;
    border:1px solid #121212; border-radius:99px; text-transform:uppercase; letter-spacing:0.4px; color:#3D3D3D; }
  .chip.active { background:#FFD166; border-color:#FFD166; color:#121212; }
  .row { display:flex; align-items:center; gap:10px; padding:8px 0; border-top:1px dashed #C9C2B4; }
  .row:first-of-type { border-top: none; }
  .time { font-family:"JetBrains Mono",monospace; font-size:9px; color:#7A756B; width:36px; text-align:right; flex-shrink:0; }
  .art-sm { width:36px; height:36px; border:1.2px solid #121212; border-radius:4px; flex-shrink:0;
    background: repeating-linear-gradient(45deg, #ECE7DC 0 6px, #E1DCCF 6px 12px); }
  .track { flex:1; min-width:0; }
  .track-title { font-size:12px; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .track-meta { font-family:"JetBrains Mono",monospace; font-size:9px; color:#7A756B; }
  .dur { font-family:"JetBrains Mono",monospace; font-size:9px; color:#7A756B; flex-shrink:0; }
  .footer { margin-top:14px; text-align:center; font-family:"JetBrains Mono",monospace; font-size:9px; color:#7A756B; }
</style>
</head>
<body>
<div class="phone">
  <div class="back">← recent</div>
  <div class="kicker">thu · apr 24</div>
  <div class="display">Today</div>

  <div class="summary">
    <div>
      <div class="stat-label">plays</div>
      <div class="stat-value">12</div>
    </div>
    <div>
      <div class="stat-label">listening</div>
      <div class="stat-value">47<span class="stat-suffix">m</span></div>
    </div>
    <div>
      <div class="stat-label">artists</div>
      <div class="stat-value">7</div>
    </div>
    <div>
      <div class="stat-label">streak</div>
      <div class="stat-value">23<span class="stat-suffix">d</span></div>
    </div>
  </div>

  <div class="chips">
    <span class="chip active">by time</span>
    <span class="chip">by artist</span>
    <span class="chip">longest</span>
  </div>

  <div>
    <!-- 12 rows -->
    <script>
      const times = ['9:42a','10:18a','10:46a','11:24a','12:08p','12:51p','1:30p','2:14p','2:48p','3:24p','3:58p','4:32p'];
      document.write(times.map(t => `
        <div class="row">
          <div class="time">${t}</div>
          <div class="art-sm"></div>
          <div class="track">
            <div class="track-title">Track title</div>
            <div class="track-meta">artist · album</div>
          </div>
          <div class="dur">3:24</div>
        </div>
      `).join(''));
    </script>
  </div>

  <div class="footer">end of day · 12 plays</div>
</div>
</body>
</html>
